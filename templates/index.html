<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Угадай слово дня!</title>
<style>
body {
    background: linear-gradient(90deg, #d3b4e9,#ffffff);
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

#theme {
    color: white;
    margin-bottom: 20px;
    font-size: 24px;
    text-align: center;
}
	
#grid {
    display: grid;
    grid-template-columns: repeat(5, 65px);
    gap: 8px;
    justify-content: center;
    margin: 20px;
}

.cell {
    width: 65px;
    height: 65px;
    border-radius: 20px;
    border: 2px solid #a3a3a3;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    transition: 0.2s;
}

.green { background: #4caf50 !important; }
.yellow { background: #ffb300 !important; }
.gray { background: #616161 !important; }

#keyboard {
    margin-top: 20px;
}

.key-row {
    margin: 5px;
}

.key {
    padding: 10px 14px;
    margin: 3px;
    border-radius: 8px;
    border: none;
	background: #7f7fbb;
    color: white;
    cursor: pointer;
    font-size: 14px;
	outline: none;
    appearance: none;
}


	
.key:hover {
    background: #5a5a8a;
}

.special {
    background: #ff7043;
	.key { background: #3a3a5a; }
	.key.green { background: #4caf50; }
	.key.yellow { background: #ffb300; }
	.key.gray { background: #555; }
}

.popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 999;
}

.hidden {
    display: none;
}

.popup-content {
    background: #2b2b45;
    padding: 35px;
    border-radius: 25px;
    width: 320px;

    text-align: center;

    box-shadow: 0 0 25px rgba(0,0,0,0.5);

    animation: popupShow 0.25s ease;
}

.popup-content h2 {
    margin-top: 0;
    color: white;
}

.popup-content p {
    color: #d0d0d0;
    margin-bottom: 20px;
}

.popup-content button {
    background: #7f7fbb;
    color: white;

    border: none;
    border-radius: 12px;

    padding: 12px 22px;

    cursor: pointer;
    font-size: 16px;
}

.popup-content button:hover {
    background: #6a6aa8;
}

@keyframes popupShow {
    from {
        transform: scale(0.7);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

</style>
</head>

<body>

<h1 style="color: #858def">Угадай слово дня!</h1>

<div id="grid"></div>
<h2 id="theme">
    Тема: ...
</h2>
<div id="keyboard"></div>
<div id="popup" class="popup hidden">
    <div class="popup-content">
        <h2 id="popup-title"></h2>
        <p id="popup-text"></p>

        <button onclick="newGame()">
            Новая игра
        </button>
    </div>
</div>
<script>
let currentRow = 0;
let currentInput = "";
let gameOver = false;
	
// 🎮 создаём сетку
function createGrid() {
    const grid = document.getElementById("grid");
    for (let i = 0; i < 30; i++) {
        const div = document.createElement("div");
        div.className = "cell";
        grid.appendChild(div);
    }
}

// ⌨️ создаём клавиатуру
function createKeyboard() {
    const layout = [
        "йцукенгшщзхъ <",
        "фывапролджэ",
        "ячсмитьбю >"
    ];

    const keyboard = document.getElementById("keyboard");

    layout.forEach(row => {
        const div = document.createElement("div");
        div.className = "key-row";

        row.split(" ").forEach(key => {
            for (let char of key) {
                const btn = document.createElement("button");
                btn.className = "key";
                btn.textContent = char;

                // 🔥 добавили идентификатор
                btn.dataset.key = char;

                if (char === ">") {
                    btn.textContent = "Ввод";
                    btn.classList.add("special");
                    btn.onclick = sendWord;
                } else if (char === "<") {
                    btn.textContent = "<==";
                    btn.classList.add("special");
                    btn.onclick = deleteLetter;
                } else {
                    btn.onclick = () => addLetter(char);
                }

                div.appendChild(btn);
            }
        });

        keyboard.appendChild(div);
    });
}

// ➕ добавить букву
function addLetter(letter) {
    if (gameOver) return;
    if (currentInput.length >= 5) return;

    currentInput += letter;
    updateGrid();
}

// ❌ удалить букву
function deleteLetter() {
    currentInput = currentInput.slice(0, -1);
    updateGrid();
}

// 🔄 обновить отображение
function updateGrid() {
    const cells = document.querySelectorAll(".cell");

    for (let i = 0; i < 5; i++) {
        const index = currentRow * 5 + i;
        cells[index].textContent = currentInput[i] || "";
    }
}

// 🔥 НОВОЕ: обновление клавиатуры
function updateKeyboard(word, colors) {
    const buttons = document.querySelectorAll(".key");

    for (let i = 0; i < word.length; i++) {
        const letter = word[i].toLowerCase();
        const color = colors[i];

        buttons.forEach(btn => {
            if (btn.textContent.toLowerCase() === letter) {

                // приоритет
                if (btn.classList.contains("green")) return;
                if (btn.classList.contains("yellow") && color === "gray") return;

                btn.classList.remove("gray", "yellow", "green");
                btn.classList.add(color);
            }
        });
    }
}



function showPopup(title, text) {
    document.getElementById("popup-title").textContent = title;
    document.getElementById("popup-text").textContent = text;

    document.getElementById("popup").classList.remove("hidden");
}

function newGame() {

    fetch("/start")
    .then(() => {

        location.reload();

    });
}

	
// 📡 отправка слова
function sendWord() {

    if (gameOver) return;

    if (currentInput.length !== 5) {
        alert("Введите 5 букв");
        return;
    }

    fetch("/guess", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ word: currentInput })
    })
    .then(res => res.json())
    .then(data => {

        if (data.error) {
            alert(data.error);
            return;
        }

        const cells = document.querySelectorAll(".cell");

        for (let i = 0; i < 5; i++) {
            const index = currentRow * 5 + i;
            cells[index].classList.add(data[i]);
        }

        updateKeyboard(currentInput, data);

        // ✅ ПРОВЕРКА ПОБЕДЫ
        if (data.every(color => color === "green")) {
            setTimeout(() => {
                showPopup(
    				"🎉 Победа!",
    				"Вы угадали слово!"
				);
            }, 200);

            gameOver = true;
            return;
        }

        currentRow++;
        currentInput = "";

        // ✅ ПРОВЕРКА ПОРАЖЕНИЯ
        if (currentRow >= 6) {

            gameOver = true;

            fetch("/secret")
            .then(res => res.json())
            .then(secretData => {
                showPopup(
				    "😢 Поражение",
				    "Слово было: " + secretData.word
				);
            });
        }
    });
}

// ⌨️ ввод с физической клавиатуры
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendWord();
    else if (e.key === "Backspace") deleteLetter();
    else if (/^[а-яё]$/i.test(e.key)) addLetter(e.key);
});



// 🚀 запуск
createGrid();
createKeyboard();

fetch("/theme")
.then(res => res.json())
.then(data => {

    document.getElementById("theme").textContent =
        "Тема: " + data.theme;

});
</script>

</body>
</html>

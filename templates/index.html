<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Угадай слово дня!</title>
<style>
body {
    background: linear-gradient(90deg, #d3b4e9,#ffffff);
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 { margin-top: 20px; }

#theme {
    color: #99a5ff;
    margin-bottom: 10px;
    font-size: 24px;
}

#grid {
    display: grid;
    grid-template-columns: repeat(var(--length), 65px);
    gap: 8px;
    justify-content: center;
    margin: 20px auto;
}

.cell {
    width: 65px;
    height: 65px;
    border-radius: 20px;
    border: 2px solid #a3a3a3;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    transition: 0.2s;
}

.green { background: #4caf50 !important; }
.yellow { background: #ffb300 !important; }
.gray { background: #616161 !important; }

#keyboard { margin-top: 20px; }

.key-row { margin: 5px; }

.key {
    padding: 10px 14px;
    margin: 3px;
    border-radius: 8px;
    border: none;
    background: #7f7fbb;
    color: white;
    cursor: pointer;
    font-size: 14px;
    outline: none;
}

.key:hover { background: #5a5a8a; }

.special { background: #ff7043; }

.popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.hidden { display: none; }

.popup-content {
    background: #2b2b45;
    padding: 35px;
    border-radius: 25px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
}

.popup-content button {
    background: #7f7fbb;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    cursor: pointer;
    font-size: 16px;
    margin: 5px;
}
</style>
</head>

<body>

<h1 style="color: #858def">Угадай слово дня!</h1>

<h2 id="theme" style="color: #99a5ff">Тема: ...</h2>

<!-- Кнопки переключения режима -->
<div style="margin: 10px;">
    <a href="/" style="margin: 0 8px; text-decoration: none;">
        <button style="padding: 8px 16px;">5 букв</button>
    </a>
    <a href="/4" style="margin: 0 8px; text-decoration: none;">
        <button style="padding: 8px 16px;">4 буквы</button>
    </a>
    <a href="/6" style="margin: 0 8px; text-decoration: none;">
        <button style="padding: 8px 16px;">6 букв</button>
    </a>
</div>

<button onclick="showSuggestPopup()" 
        style="margin: 10px auto; padding: 8px 16px; background: #7f7fbb; color: white; border: none; border-radius: 8px; cursor: pointer;">
    Предложить слово
</button>

<div id="grid" data-length="{{ length|default(5) }}"></div>
<div id="keyboard"></div>

<!-- Основной popup -->
<div id="popup" class="popup hidden">
    <div class="popup-content">
        <h2 id="popup-title"></h2>
        <p id="popup-text"></p>
        <button onclick="newGame()">Новая игра</button>
    </div>
</div>

<!-- Popup предложения слова -->
<div id="suggestPopup" class="popup hidden">
    <div class="popup-content">
        <h2>Предложить новое слово</h2>
        <p style="margin-bottom: 15px;">Введите слово:</p>
        <input type="text" id="suggestInput" maxlength="10" 
               style="width: 100%; padding: 12px; font-size: 18px; text-align: center; text-transform: uppercase; margin-bottom: 20px; border-radius: 8px; border: 2px solid #555;">
        <button onclick="sendSuggestWord()">Отправить</button>
        <button onclick="hideSuggestPopup()" style="background: #555;">Отмена</button>
    </div>
</div>
    
<script>
// Получаем длину слова из data-length
const length = parseInt(document.getElementById("grid").dataset.length) || 5;

let currentRow = 0;
let currentInput = "";
let gameOver = false;

// Создаём сетку
function createGrid() {
    const grid = document.getElementById("grid");
    grid.style.setProperty('--length', length);
    grid.innerHTML = "";
    
    for (let i = 0; i < 6 * length; i++) {
        const div = document.createElement("div");
        div.className = "cell";
        grid.appendChild(div);
    }
}

// Создаём клавиатуру
function createKeyboard() {
    const layout = [
        "йцукенгшщзхъ <",
        "фывапролджэ",
        "ячсмитьбю >"
    ];

    const keyboard = document.getElementById("keyboard");
    keyboard.innerHTML = "";

    layout.forEach(row => {
        const div = document.createElement("div");
        div.className = "key-row";

        row.split(" ").forEach(key => {
            for (let char of key) {
                const btn = document.createElement("button");
                btn.className = "key";
                btn.textContent = char;
                btn.dataset.key = char;

                if (char === ">") {
                    btn.textContent = "Ввод";
                    btn.classList.add("special");
                    btn.onclick = sendWord;
                } else if (char === "<") {
                    btn.textContent = "<==";
                    btn.classList.add("special");
                    btn.onclick = deleteLetter;
                } else {
                    btn.onclick = () => addLetter(char);
                }
                div.appendChild(btn);
            }
        });
        keyboard.appendChild(div);
    });
}

function addLetter(letter) {
    if (gameOver || currentInput.length >= length) return;
    currentInput += letter;
    updateGrid();
}

function deleteLetter() {
    currentInput = currentInput.slice(0, -1);
    updateGrid();
}

function updateGrid() {
    const cells = document.querySelectorAll(".cell");
    for (let i = 0; i < length; i++) {
        const index = currentRow * length + i;
        cells[index].textContent = currentInput[i] || "";
    }
}

function updateKeyboard(word, colors) {
    const buttons = document.querySelectorAll(".key");

    for (let i = 0; i < word.length; i++) {
        const letter = word[i].toLowerCase();
        const color = colors[i];

        buttons.forEach(btn => {
            if (btn.textContent.toLowerCase() === letter) {
                if (btn.classList.contains("green")) return;
                if (btn.classList.contains("yellow") && color === "gray") return;

                btn.classList.remove("gray", "yellow", "green");
                btn.classList.add(color);
            }
        });
    }
}

function showPopup(title, text) {
    document.getElementById("popup-title").textContent = title;
    document.getElementById("popup-text").textContent = text;
    document.getElementById("popup").classList.remove("hidden");
}

function newGame() {
    fetch("/start")
    .then(() => location.reload());
}

function sendWord() {
    if (gameOver) return;
    if (currentInput.length !== length) {
        alert(`Введите ${length} букв`);
        return;
    }

    fetch("/guess", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word: currentInput })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
            return;
        }

        const cells = document.querySelectorAll(".cell");
        for (let i = 0; i < length; i++) {
            const index = currentRow * length + i;
            cells[index].classList.add(data[i]);
        }

        updateKeyboard(currentInput, data);

        if (data.every(color => color === "green")) {
            setTimeout(() => showPopup("🎉 Победа!", "Вы угадали слово!"), 200);
            gameOver = true;
            return;
        }

        currentRow++;
        currentInput = "";

        if (currentRow >= 6) {
            gameOver = true;
            fetch("/secret")
            .then(res => res.json())
            .then(secretData => {
                showPopup("😢 Поражение", "Слово было: " + secretData.word);
            });
        }
    });
}

// Ввод с физической клавиатуры
document.addEventListener("keydown", (e) => {
    if (gameOver) return;
    if (e.key === "Enter") sendWord();
    else if (e.key === "Backspace") deleteLetter();
    else if (/^[а-яё]$/i.test(e.key)) addLetter(e.key.toLowerCase());
});

// Popup "Предложить слово"
function showSuggestPopup() {
    document.getElementById("suggestPopup").classList.remove("hidden");
    const input = document.getElementById("suggestInput");
    input.value = "";
    input.focus();
}

function hideSuggestPopup() {
    document.getElementById("suggestPopup").classList.add("hidden");
}

function sendSuggestWord() {
    const word = document.getElementById("suggestInput").value.trim().toLowerCase();
    if (word.length < 3 || word.length > 10) {
        alert("Слово должно быть от 3 до 10 букв");
        return;
    }

    fetch("/suggest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word: word })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) alert(data.error);
        else {
            alert(data.message);
            hideSuggestPopup();
        }
    })
    .catch(() => alert("Ошибка соединения"));
}

// Запуск
createGrid();
createKeyboard();

fetch("/theme")
.then(res => res.json())
.then(data => {
    document.getElementById("theme").textContent = "Тема: " + (data.theme || "Без темы");
});
</script>
    
</body>
</html>
